# Copy to config.toml and edit. The gateway is deny-by-default:
# only messages from mapped Signal groups / listed LXMF members are bridged.

[gateway]
display_name = "Signal Gateway"
storage = "/var/lib/rns-signal"
max_message_bytes = 4096     # drop larger text (LoRa-friendly)
max_attachment_bytes = 1000000  # drop larger attachments, keep the text
announce_interval = 3600     # seconds between LXMF announces
# Require LXMF stamps (proof-of-work) on inbound messages; senders' clients
# generate them automatically. Outbound messages include tickets so members
# can reply without the work. Omit to accept unstamped messages.
# stamp_cost = 8
# Store-and-forward for offline members: failed direct deliveries are
# handed to an LXMF propagation node, and the gateway syncs its own
# mailbox from it. "auto" picks the nearest announced node (remembered
# across restarts); or set an explicit propagation node hash.
# propagation_node = "auto"
# Transcode Signal voice notes to codec2 FIELD_AUDIO at this bitrate
# (450/700/1200/1300/1400/1600/2400/3200) — tiny and LoRa-friendly, plays
# in Sideband's voice UI. Needs ffmpeg + pycodec2. Omit to pass audio
# through as files.
# voice_to_codec2 = 2400
# Downscale/recompress Signal images to WebP under this size before
# bridging (needs Pillow). Omit to only shrink images that exceed
# max_attachment_bytes. Can be overridden per channel.
# image_max_bytes = 262144
# LXMF per-transfer acceptance limit in KB (default 8192). Transfers
# above this are rejected at the LXMF layer before the gateway can
# downscale them; raise for big images, lower for radio-bound gateways.
# lxmf_delivery_limit_kb = 8192

[signal]
rpc_url = "http://127.0.0.1:7583"
account = "+1XXXXXXXXXX"
# Where the signal-cli daemon stores received attachments:
# attachment_dir = "~/.local/share/signal-cli/attachments"
# Optional extra ACL. Omit to allow any member of a mapped group.
# allowed_users = ["+15551234567"]

# One [[channels]] block per Signal group <-> LXMF distribution list.
# Get the group id with: signal-cli -a +1XXXXXXXXXX listGroups
[[channels]]
name = "backcountry"
signal_group = "SIGNAL_GROUP_ID_BASE64"
members = [
    # LXMF destination hashes: these receive the fan-out from Signal
    # and are the only sources allowed to post into the group.
    "a91d0000000000000000000000000000",
]
# open = true            # allow LXMF users to /join this channel themselves
# image_max_bytes = 32768  # tighter image budget for a LoRa-bound channel
